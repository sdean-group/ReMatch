
hydra:
    job:
          chdir: false
          name: rematch_s_diffusion
    run:
          dir: ./hydra/${hydra:job.name}
    searchpath:
          - pkg://conf/base # Do not modify

# Base parameters for dataset, model, training, and validation
defaults:

    - dataset: hrrr_mini_ot
    - model: diffusion
    - model_size: mini
    - training: ${model}
    # The base training parameters. Determined by the model type.


# Dataset parameters. Used for `custom` dataset type.
# Modify or add below parameters that should be passed as argument to the
# user-defined dataset class.
dataset:
    type: hrrr_mini_ot
    data_path: <data_path.nc>
    stats_path: /data/corrdiff3d/hrrrmini_east_train_ble_temporal_stats.json
    
    # Path to json stats file
    #dont need to traiin on surface vars but keep them in the data
    input_variables: ["50u", "50v", "75u","75v", "100u", "100v", "125u", "125v", "150u", "150v","month_sin","month_cos","day_sin","day_cos"]
    output_variables: ["50u", "50v", "75u","75v", "100u", "100v", "125u", "125v", "150u", "150v"]

# Training parameters
training:
    hp:
        training_duration: 8000000
        # Training duration based on the number of processed samples
    io:
        print_progress_freq: 10000
        regression_checkpoint_path: <regression_checkpoint.mdlus>
        # Path to load the regression checkpoint
        save_checkpoint_freq: 1000000
        checkpoint_dir: <checkpoint_dir>
        
swinir:
    checkpoint_path: null
    resume: null

    model_args:
        in_chans: 14
        out_chans: 10
        img_size: [21, 21]
        upscale: 8
        window_size: 7
        embed_dim: 180
        depths: [6, 6, 6, 6, 6, 6]
        num_heads: [6, 6, 6, 6, 6, 6]
        mlp_ratio: 2.0
        drop_path_rate: 0.0
        use_checkpoint: false
        multi_step_sampler: true

    train:
        loss: l1
        lr: 2.0e-4
        weight_decay: 0.0
        grad_clip: 0.0
        amp: false
        num_workers: 4
        val_interval: 1000
        val_batch_size: 5
        val_max_batches: 20
# Parameters for wandb logging
wandb:
    mode: disabled
    # Configure whether to use wandb: "offline", "online", "disabled"
    results_dir: "./wandb"
    # Directory to store wandb results
    watch_model: false
    # If true, wandb will track model parameters and gradients
