hydra:
    job:
          chdir: false
          # trained on 2018-2021 pressures and temporal context. select one day from each month to see the ensemble spreads
          name: generate_600_samples
    run:
          dir: ./hydra/${hydra:job.name}
    searchpath:
          - pkg://conf/base # Do not modify

# Base parameters for dataset, model, and generation
defaults:

    - dataset: hrrr_mini_raw

    - generation: non_patched
dataset:
    # data_path: /mnt/hrrr_era5_0528/hrrr_era5_calibration_2020.nc
    # # Path to .nc data file
    # stats_path: /mnt/hrrr_era5_0528/hrrr_era5_calibration_2020_stats.json
    data_path: /mnt/hrrr_era5_0528/hrrr_era5_test_2021.nc
    # Path to .nc data file
    stats_path: /mnt/hrrr_era5_0528/hrrr_era5_test_2021_stats.json
    # Path to json stats file
    input_variables: ["50u", "50v", "75u","75v", "100u", "100v", "125u", "125v", "150u", "150v","month_sin","month_cos","day_sin","day_cos"]
    output_variables: ["50u", "50v", "75u","75v", "100u", "100v", "125u", "125v", "150u", "150v"]
    # time_flag: True
    

# Generation parameters to specialize
bias_shape: [16,16]
generation:
    num_ensembles: 12
    # int, number of ensembles to generate per input
    seed_batch_size: 1
    inference_mode: "all" # bias for CorrDiffRegressionUNet, verifier for VerifierUNet
    hr_mean_conditioning: True
    load_all_times: False
    # int, size of the batched inference
    times:
    - "2021-05-02T00:00:00"
    - "2021-05-02T01:00:00"
