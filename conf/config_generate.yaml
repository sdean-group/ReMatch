# Parameters for wandb logging
wandb:
    mode: offline
    # Configure whether to use wandb: "offline", "online", "disabled"

swinir:
    checkpoint_path: null
    resume: null

    model_args:
        in_chans: 14
        out_chans: 10
        img_size: [21, 21]
        upscale: 8
        window_size: 7
        embed_dim: 180
        depths: [6, 6, 6, 6, 6, 6]
        num_heads: [6, 6, 6, 6, 6, 6]
        mlp_ratio: 2.0
        drop_path_rate: 0.0
        use_checkpoint: false
        multi_step_sampler: true
