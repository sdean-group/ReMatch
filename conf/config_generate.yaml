hydra:
    job:
          chdir: false
          name: generate_monthly
    run:
          dir: ./hydra/${hydra:job.name}
    searchpath:
          - pkg://conf/base # Do not modify

# Base parameters for dataset, model, and generation
defaults:

    - dataset: hrrr_mini_raw
    - generation: non_patched
dataset:
    type: hrrr_mini_raw
    data_path:  /data/hrrr_era5_east/hrrr_era5_test_2021.nc
    # Path to .nc data file
    stats_path: /data/hrrr_era5_east/hrrr_era5_test_2021_stats.json
    # Path to json stats file
    input_variables: ["50u", "50v", "75u","75v", "100u", "100v", "125u", "125v", "150u", "150v","month_sin","month_cos","day_sin","day_cos"]
    output_variables: ["50u", "50v", "75u","75v", "100u", "100v", "125u", "125v", "150u", "150v"]

# Generation parameters to specialize
generation:
    num_ensembles: 12
    # int, number of ensembles to generate per input
    seed_batch_size: 1
    # int, size of the batched inference
    load_all_times: False
    times:
        - "2021-01-02T23:00:00"
        - "2021-02-02T23:00:00"
        - "2021-03-02T23:00:00"
        - "2021-04-02T23:00:00"
        - "2021-05-02T23:00:00"
        - "2021-06-02T23:00:00"
        - "2021-07-02T23:00:00"
        - "2021-08-02T23:00:00"
        - "2021-09-02T23:00:00"
        - "2021-10-02T23:00:00"
        - "2021-11-02T23:00:00"
        - "2021-12-02T23:00:00"

    # List[str], time stamps in ISO 8601 format. Replace and list desired target
    # time stamps.
    # TRY THIS OUT WITH AN EARLIER CHECKPOINT TO SEE WHETHER IT ACC IMPROVED
    io:
        output_filename:  <path/to/output.nc>
        res_ckpt_filename: <path/to/checkpoint.mdlus>
        reg_ckpt_filename: <path/to/checkpoint.mdlus>
# Parameters for wandb logging
wandb:
    mode: offline
    # Configure whether to use wandb: "offline", "online", "disabled"

swinir:
    checkpoint_path: null
    resume: null

    model_args:
        in_chans: 14
        out_chans: 10
        img_size: [21, 21]
        upscale: 8
        window_size: 7
        embed_dim: 180
        depths: [6, 6, 6, 6, 6, 6]
        num_heads: [6, 6, 6, 6, 6, 6]
        mlp_ratio: 2.0
        drop_path_rate: 0.0
        use_checkpoint: false
        multi_step_sampler: true
