hydra:
    job:
          chdir: false
          name: swinir_regression
    run:
          dir: ./hydra/${hydra:job.name}
    searchpath:
          - pkg://conf/base # Do not modify

# Base parameters for dataset, model, training, and validation
defaults:

    - dataset: hrrr_mini_raw
    - model: regression
    - model_size: mini
    - training: ${model}
model:
    name: swinir_regression

# Dataset parameters. Used for `custom` dataset type.
# Modify or add below parameters that should be passed as argument to the
# user-defined dataset class.
dataset:
    type: hrrr_mini_raw
    data_path: /data/corrdiff3d/hrrrmini_east_train_ble_temporal.nc
    # Path to .nc data file
    stats_path: /data/corrdiff3d/hrrrmini_east_train_ble_temporal_stats.json

    input_variables: ["50u", "50v", "75u","75v", "100u", "100v", "125u", "125v", "150u", "150v","month_sin","month_cos","day_sin","day_cos"]
    output_variables: ["50u", "50v", "75u","75v", "100u", "100v", "125u", "125v", "150u", "150v"]

# Training parameters
training:
    hp:
        training_duration: 1000 #100000
        batch_size_per_gpu: 32
        # Training duration based on the number of processed samples
    io:
        print_progress_freq: 10000
        checkpoint_dir: <checkpoint_dir>
        save_checkpoint_freq: 1000  #20000


# Parameters for wandb logging
# wandb:
#     mode: disabled
#     # Configure whether to use wandb: "offline", "online", "disabled"
#     results_dir: "./wandb"
#     # Directory to store wandb results
#     watch_model: false
#     # If true, wandb will track model parameters and gradients
swinir:
    checkpoint_path: null
    resume: null

    model_args:
        in_chans: 14
        out_chans: 10
        img_size: [21, 21]
        upscale: 8
        window_size: 7
        embed_dim: 180
        depths: [6, 6, 6, 6, 6, 6]
        num_heads: [6, 6, 6, 6, 6, 6]
        mlp_ratio: 2.0
        drop_path_rate: 0.0
        use_checkpoint: false
        multi_step_sampler: true

    train:
        loss: l1
        lr: 2.0e-4
        weight_decay: 0.0
        grad_clip: 0.0
        amp: false
        num_workers: 4
        val_interval: 1000
        val_batch_size: 5
        val_max_batches: 20