hydra:
    job:
          chdir: false
          name: convFNO
    run:
          dir: ./hydra/${hydra:job.name}
    searchpath:
          - pkg://conf/base # Do not modify

# Base parameters for dataset, model, training, and validation
defaults:

    - dataset: hrrr_mini_raw 
    - model: regression

    - model_size: mini
    - training: ${model}
dataset:
    type: hrrr_mini_raw
    data_path: /mnt/hrrr_era5_0528/hrrr_era5_train_2018_2020.nc
    # Path to .nc data file
    stats_path: /mnt/hrrr_era5_0528/hrrr_era5_train_2018_2020_stats.json 
    # Path to json stats file
    #dont need to traiin on surface vars but keep them in the dta
    input_variables: ["50u", "50v", "75u","75v", "100u", "100v", "125u", "125v", "150u", "150v", "month_sin","month_cos","day_sin","day_cos"]
    output_variables: ["50u", "50v", "75u","75v", "100u", "100v", "125u", "125v", "150u", "150v"]


# Training parameters
training:
    hp:
        training_duration: 8000000
        # Training duration based on the number of processed samples
    io:
        print_progress_freq: 10000
        checkpoint_dir: <checkpoint_dir>
        save_checkpoint_freq: 1000000
convfno:
    arch:
        decoder:
            out_features: 10
            layers: 1
            layer_size : 32 # this is also nfeats i think.  was 32, changing to 34 to match BlasetNet 5M param count
            upscale: 8

        fno:
            in_channels: 14
            dimension: 2
            latent_channels: 32 # this is nfeats. also was 32.
            kernel_size: 3 # blastnet added this
            fno_layers: 4 # was 4 but blastnet did 32
            fno_modes: 12 #was 12 but blastnet does 2
            padding: 9 # was 9 but blastent did 6
        scheduler:
            initial_lr: 4.E-3
            decay_rate: .95
            decay_steps: 1000

