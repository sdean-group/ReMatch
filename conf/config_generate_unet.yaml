hydra:
    job:
          chdir: false
          name: generate_unet_hrrr_ear5
    run:
          dir: ./hydra/${hydra:job.name}
    searchpath:
          - pkg://conf/base # Do not modify

# Base parameters for dataset, model, and generation
defaults:

    - dataset: hrrr_mini
    # The dataset type for training.
    # Accepted values:
    #   `gefs_hrrr`: full GEFS-HRRR dataset for continental US.
    #   `hrrr_mini`: smaller HRRR dataset (continental US), for fast experiments.
    #   `cwb`: full CWB dataset for Taiwan.
    #   `custom`: user-defined dataset. Parameters need to be specified below.

    - generation: non_patched
    # The base generation parameters.
    # Accepted values:
    #     `patched`: base parameters for a patch-based model
    #     `non_patched`: base parameters for a non-patched model


# Dataset parameters. Used for `custom` dataset type.
# Modify or add below parameters that should be passed as argument to the
# user-defined dataset class.
dataset:
    data_path: /data/corrdiff3d/hrrrmini_east_test_ble_temporal.nc
    # Path to .nc data file
    stats_path: /data/corrdiff3d/hrrrmini_east_test_ble_temporal_stats.json
    # Path to json stats file
    input_variables: ["50u", "50v", "75u","75v", "100u", "100v", "125u", "125v", "150u", "150v","month_sin","month_cos","day_sin","day_cos"]
    output_variables: ["50u", "50v", "75u","75v", "100u", "100v", "125u", "125v", "150u", "150v"]

# Generation parameters to specialize
generation:
    num_ensembles: 12
    # int, number of ensembles to generate per input
    seed_batch_size: 1
    # int, size of the batched inference
    load_all_times: False
    times:
        - "2021-01-02T23:00:00"
        - "2021-02-02T23:00:00"
        - "2021-03-02T23:00:00"
        - "2021-04-02T23:00:00"
        - "2021-05-02T23:00:00"
        - "2021-06-02T23:00:00"
        - "2021-07-02T23:00:00"
        - "2021-08-02T23:00:00"
        - "2021-09-02T23:00:00"
        - "2021-10-02T23:00:00"
        - "2021-11-02T23:00:00"
        - "2021-12-02T23:00:00"

    # List[str], time stamps in ISO 8601 format. Replace and list desired target
    # time stamps.
    # TRY THIS OUT WITH AN EARLIER CHECKPOINT TO SEE WHETHER IT ACC IMPROVED
    io:
        output_filename: ./outputs/hrrr_mini_east/ble_generation_files/corrdif_residual_2021_BLErditfix2allpressures_temporal_50samples.nc
        res_ckpt_filename: /home/nvidia/projects/corrdiff_original/checkpoints/hrrr_mini_east_train/blepressures_temporal/checkpoints_diffusion/EDMPrecondSuperResolution.0.8000000.mdlus
        reg_ckpt_filename: /home/nvidia/projects/ReMatch/outputs/hrrr_era5/checkpoints/rematch_u/checkpoints_regression/CorrDiffRegressionUNet.0.3008.mdlus
# Parameters for wandb logging
# wandb:
#     mode: offline
    # Configure whether to use wandb: "offline", "online", "disabled"